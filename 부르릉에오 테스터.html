<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부르릉-에오 테스터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Noto+Serif+KR:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0C0B0F;
    --bg-soft: #131218;
    --card: #131217;
    --card2: #1A1820;
    --ink: #F3EFE7;
    --muted: #9C96A3;
    --line: rgba(243,239,231,0.22);
    --line-soft: rgba(243,239,231,0.10);
    --accent: #C7A468;
    --accent-soft: rgba(199,164,104,0.14);
    --accent-ink: #241E12;
    --danger: #C2695A;
    --danger-soft: rgba(194,105,90,0.12);
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(199,164,104,0.08), transparent 55%),
      radial-gradient(ellipse at 50% 110%, rgba(0,0,0,0.5), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: 'Inter', 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 28px 16px;
  }
  .stage{ width:100%; max-width: 560px; }

  .brand-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 18px; padding: 0 4px;
  }
  .brand{
    font-family:'Fraunces', 'Noto Serif KR', serif; font-weight:500; font-size: 19px; color: var(--ink);
    letter-spacing: 1.5px;
  }
  .brand-right{ display:flex; align-items:center; gap: 16px; }
  .lang{
    display:flex; align-items:center; gap: 8px; font-size: 11.5px; color: var(--muted);
    letter-spacing: 0.5px;
  }
  .lang span{ cursor:default; }
  .lang span.active{ color: var(--ink); }
  .lang-divider{ color: var(--line); }
  .btn-login{
    font-family:'Inter', sans-serif; font-weight: 500; font-size: 11px;
    letter-spacing: 1px; text-transform: uppercase;
    color: var(--muted); background: transparent;
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 7px 15px;
    cursor: default;
    transition: border-color .15s ease, color .15s ease;
  }
  .btn-login:hover{ border-color: var(--accent); color: var(--ink); }

  .card{
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 52px 40px 40px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.4);
  }
  .card::before{
    content:"";
    position:absolute; left: 40px; right: 40px; top: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.6;
  }
  .screen{ display:none; }
  .screen.active{ display:block; animation: pop .38s ease; }
  @keyframes pop{ from{ opacity:0; transform: translateY(8px);} to{ opacity:1; transform:translateY(0);} }

  /* ---------- Screen 1: Landing ---------- */
  .hero{
    position: relative;
    min-height: 230px;
    display:flex; align-items:center; justify-content:flex-end;
    margin-bottom: 34px;
    padding-top: 4px;
  }
  .hero-visual{
    position: absolute;
    right: -30px; top: 50%; transform: translateY(-50%);
    width: 300px; height: 300px;
    opacity: 0.1;
    z-index: 0;
    pointer-events: none;
  }
  .hero-text{
    position: relative; z-index: 1;
    text-align: right;
    width: 100%;
  }
  .eyebrow{
    font-family: 'Inter', sans-serif;
    font-size: 11.5px; font-weight: 500;
    letter-spacing: 4px; text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 6px;
  }
  h1.title{
    font-family:'Fraunces', 'Noto Serif KR', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 48px;
    line-height: 1.08;
    text-align:right;
    margin: 0;
    color: var(--ink);
  }
  .title-sub{
    font-family: 'Inter', sans-serif;
    font-size: 12px; font-weight: 500;
    letter-spacing: 5px; text-transform: uppercase;
    color: var(--muted);
    margin: 12px 0 0;
  }
  .btn-wide{
    display:block;
    width: 100%;
    font-family:'Inter', sans-serif;
    font-size: 13px; font-weight: 600;
    letter-spacing: 2.5px; text-transform: uppercase;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--ink);
    padding: 17px 20px;
    border-radius: 2px;
    cursor: pointer;
    transition: background .2s ease, color .2s ease;
  }
  .btn-wide:hover{ background: var(--accent); color: var(--accent-ink); }
  .btn-wide:active{ filter: brightness(0.95); }
  .btn{
    font-family:'Inter', sans-serif;
    font-size: 12.5px; font-weight: 600;
    letter-spacing: 1.5px; text-transform: uppercase;
    border: 1px solid var(--ink);
    background: transparent; color: var(--ink);
    padding: 13px 26px;
    border-radius: 2px;
    cursor: pointer;
    display:block; margin: 0 auto;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .btn:hover{ background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .btn.primary{ border-color: var(--accent); }
  .btn.primary:hover{ background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.ghost{ border-color: var(--line); color: var(--muted); }
  .btn.ghost:hover{ background: transparent; color: var(--ink); border-color: var(--ink); }
  .btn-row{ display:flex; gap: 12px; justify-content:center; margin-top: 26px; flex-wrap: wrap; }

  /* ---------- Screen 2: Recording ---------- */
  .step-label{
    text-align:center; color: var(--muted); font-size: 11px; font-weight: 500;
    letter-spacing: 2.5px; text-transform: uppercase; margin-bottom: 10px;
  }
  .prompt-word{
    font-family:'Fraunces', 'Noto Serif KR', serif;
    font-style: italic; font-weight: 500;
    font-size: 42px; text-align:center;
    margin: 4px 0 34px;
    color: var(--ink);
  }
  .ref-row{
    display:flex; align-items:center; justify-content:center; gap: 16px;
    margin-bottom: 40px;
  }
  .play-btn{
    width: 48px; height:48px; border-radius:50%;
    border: 1px solid var(--accent); background: transparent;
    color: var(--accent); font-size: 15px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex: none;
    transition: background .15s ease, color .15s ease;
  }
  .play-btn:hover{ background: var(--accent); color: var(--accent-ink); }
  .ref-bars{ display:flex; align-items:flex-end; gap: 4px; height: 26px; }
  .ref-bars i{
    width: 2px; background: var(--accent); border-radius: 1px; opacity: .4;
    height: 6px; display:block;
    animation: none;
  }
  .ref-bars.playing i{ animation: bounce 1s ease-in-out infinite; opacity: .9; }
  .ref-bars i:nth-child(1){ animation-delay: 0s; }
  .ref-bars i:nth-child(2){ animation-delay: .12s; }
  .ref-bars i:nth-child(3){ animation-delay: .24s; }
  .ref-bars i:nth-child(4){ animation-delay: .36s; }
  .ref-bars i:nth-child(5){ animation-delay: .48s; }
  @keyframes bounce{ 0%,100%{ height: 6px; } 50%{ height: 24px; } }

  .mic-zone{ display:flex; flex-direction:column; align-items:center; gap: 16px; margin-bottom: 6px; }
  .mic-btn{
    width: 88px; height: 88px; border-radius: 50%;
    border: 1px solid var(--line); background: transparent;
    color: var(--ink); font-size: 26px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; position:relative;
    transition: border-color .15s ease, color .15s ease;
  }
  .mic-btn:hover{ border-color: var(--ink); }
  .mic-btn.recording{
    border-color: var(--danger); color: var(--danger);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ box-shadow: 0 0 0 0 rgba(194,105,90,0.35); }
    50%{ box-shadow: 0 0 0 10px rgba(194,105,90,0); }
  }
  .mic-label{
    font-family:'Inter', sans-serif; font-size: 11px; font-weight: 500;
    letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted);
  }
  .mic-level{ display:flex; align-items:flex-end; gap: 3px; height: 18px; margin-top: -2px; }
  .mic-level i{ width: 2px; background: var(--danger); border-radius: 1px; height: 3px; }
  .status-line{ text-align:center; color: var(--muted); font-size: 12.5px; min-height: 18px; margin-top: 12px; }

  /* ---------- Screen 3: Result ---------- */
  .gauge-wrap{ display:flex; justify-content:center; margin-bottom: 4px; }
  .score-num{
    text-align:center; font-family:'Inter', sans-serif; font-weight: 500;
    font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); margin-top: 10px;
  }
  .score-num b{
    font-family:'Fraunces', 'Noto Serif KR', serif; font-style: italic; font-weight: 500;
    font-size: 44px; letter-spacing: 0; text-transform: none;
    color: var(--ink); display:block; margin-top: 4px;
  }
  .rank-title{
    text-align:center; font-family:'Fraunces', 'Noto Serif KR', serif; font-style: italic; font-weight: 500;
    font-size: 24px; color: var(--accent); margin: 18px 0 6px;
  }
  .rank-quote{ text-align:center; color: var(--muted); font-size: 13.5px; margin: 0 0 30px; }
  .result-actions{ display:flex; gap: 12px; justify-content:center; }

  .hidden{ display:none !important; }
  .error-box{
    text-align:center; color: var(--danger); font-size: 13px;
    background: var(--danger-soft); border: 1px solid var(--danger);
    border-radius: 2px; padding: 10px 14px; margin: 14px 0 0;
  }
  .footnote{
    text-align:center; color: var(--muted); font-size: 11.5px; margin-top: 22px; line-height: 1.7;
  }

  @media (prefers-reduced-motion: reduce){
    .ref-bars.playing i, .mic-btn.recording{ animation: none !important; }
  }
  @media (max-width: 420px){
    .card{ padding: 40px 24px 30px; }
    h1.title{ font-size: 36px; }
    .hero{ min-height: 190px; }
    .hero-visual{ width: 210px; height: 210px; right: -12px; }
    .prompt-word{ font-size: 32px; }
  }
</style>
</head>
<body>
<div class="stage">

  <div class="brand-row">
    <span class="brand">부르릉</span>
    <div class="brand-right">
      <span class="lang"><span class="active">한국어</span><span class="lang-divider">/</span><span>English</span></span>
      <button class="btn-login" id="btn-login" type="button">Log in</button>
    </div>
  </div>

  <div class="card">

    <!-- Screen 1 : Landing -->
    <section class="screen active" id="screen-landing">
      <div class="hero">
        <svg class="hero-visual" viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="#F3EFE7" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M52 176 C40 176 32 164 32 148 C32 118 46 94 60 80 C50 66 48 48 56 34 C64 44 70 56 72 66 C84 60 98 58 112 60 C116 48 126 36 138 32 C140 46 138 58 132 68 C148 78 158 96 160 118 C176 122 186 134 186 150 C186 166 174 178 158 178 L52 176Z"/>
          <path d="M60 80 C64 92 74 100 88 102" fill="none"/>
          <circle cx="96" cy="86" r="2.4" fill="#F3EFE7" stroke="none"/>
          <path d="M108 96 C114 98 120 98 126 95" fill="none"/>
          <path d="M40 150 C46 146 54 146 60 150" fill="none"/>
          <path d="M42 160 C48 158 56 158 62 161" fill="none"/>
          <line x1="186" y1="150" x2="204" y2="146"/>
          <line x1="184" y1="160" x2="202" y2="162"/>
        </svg>
        <div class="hero-text">
          <p class="eyebrow">The</p>
          <h1 class="title">부르릉 에오</h1>
          <p class="title-sub">Test</p>
        </div>
      </div>
      <button class="btn-wide" id="btn-start">Test start!</button>
    </section>

    <!-- Screen 2 : Record -->
    <section class="screen" id="screen-record">
      <p class="step-label">원본을 듣고, 똑같이 따라 말해보세요</p>
      <p class="prompt-word">부르릉 에오!</p>

      <div class="ref-row">
        <button class="play-btn" id="btn-play" aria-label="원본 재생">▶</button>
        <div class="ref-bars" id="ref-bars">
          <i></i><i></i><i></i><i></i><i></i>
        </div>
      </div>

      <div class="mic-zone">
        <button class="mic-btn" id="btn-mic" aria-label="녹음하기">🎙</button>
        <div class="mic-level" id="mic-level"></div>
        <p class="mic-label" id="mic-label">눌러서 말하기!</p>
      </div>
      <p class="status-line" id="status-line"></p>
      <div class="error-box hidden" id="error-box"></div>
    </section>

    <!-- Screen 3 : Result -->
    <section class="screen" id="screen-result">
      <p class="step-label">측정 결과</p>
      <div class="gauge-wrap">
        <svg id="gauge-svg" width="260" height="150" viewBox="0 0 260 150">
          <defs>
            <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#8A6E3E"/>
              <stop offset="100%" stop-color="#C7A468"/>
            </linearGradient>
          </defs>
          <path d="M 24 132 A 106 106 0 0 1 236 132" stroke="rgba(243,239,231,0.12)" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path id="gauge-arc" d="M 24 132 A 106 106 0 0 1 236 132" stroke="url(#gaugeGrad)" stroke-width="2" fill="none" stroke-linecap="round"
                stroke-dasharray="333" stroke-dashoffset="333"/>
          <g id="gauge-needle" style="transform-origin: 130px 132px; transform: rotate(-90deg); transition: transform 1.1s cubic-bezier(.2,1,.3,1);">
            <line x1="130" y1="132" x2="130" y2="48" stroke="#F3EFE7" stroke-width="1" stroke-linecap="round"/>
            <circle cx="130" cy="132" r="3.5" fill="#C7A468"/>
          </g>
        </svg>
      </div>
      <p class="score-num">유사도<b id="score-value">0%</b></p>
      <p class="rank-title" id="rank-title">—</p>
      <p class="rank-quote" id="rank-quote">—</p>

      <div class="result-actions">
        <button class="btn ghost" id="btn-retry">다시하기</button>
        <button class="btn primary" id="btn-home">처음으로</button>
      </div>
    </section>

  </div>

  <p class="footnote">마이크로 녹음한 음성과 원본 소리의 에너지·음색 패턴을 비교해 유사도를 계산해요.<br>발음보다는 리듬과 억양의 '느낌'을 보는 재미용 테스트예요.</p>

<script>
(function(){
  "use strict";

  // ---------- Screen navigation ----------
  const screens = {
    landing: document.getElementById('screen-landing'),
    record: document.getElementById('screen-record'),
    result: document.getElementById('screen-result'),
  };
  function showScreen(name){
    Object.values(screens).forEach(s=>s.classList.remove('active'));
    screens[name].classList.add('active');
  }

  document.getElementById('btn-start').addEventListener('click', ()=> showScreen('record'));
  document.getElementById('btn-home').addEventListener('click', ()=>{
    resetRecordScreen();
    showScreen('landing');
  });
  document.getElementById('btn-retry').addEventListener('click', ()=>{
    resetRecordScreen();
    showScreen('record');
  });

  // ---------- Reference playback ----------
  const refAudioEl = document.getElementById('ref-audio');
  const btnPlay = document.getElementById('btn-play');
  const refBars = document.getElementById('ref-bars');
  btnPlay.addEventListener('click', ()=>{
    if(refAudioEl.paused){
      refAudioEl.currentTime = 0;
      refAudioEl.play();
    } else {
      refAudioEl.pause();
    }
  });
  refAudioEl.addEventListener('play', ()=>{ btnPlay.textContent = '❚❚'; refBars.classList.add('playing'); });
  refAudioEl.addEventListener('pause', ()=>{ btnPlay.textContent = '▶'; refBars.classList.remove('playing'); });
  refAudioEl.addEventListener('ended', ()=>{ btnPlay.textContent = '▶'; refBars.classList.remove('playing'); });

  // ---------- Mic level bars (build 14 bars) ----------
  const micLevel = document.getElementById('mic-level');
  const LEVEL_BARS = 14;
  for(let i=0;i<LEVEL_BARS;i++){
    const b = document.createElement('i');
    micLevel.appendChild(b);
  }
  const levelBarEls = Array.from(micLevel.children);

  // ---------- Recording ----------
  const btnMic = document.getElementById('btn-mic');
  const micLabel = document.getElementById('mic-label');
  const statusLine = document.getElementById('status-line');
  const errorBox = document.getElementById('error-box');

  let audioCtx = null;
  let mediaStream = null;
  let mediaRecorder = null;
  let recordedChunks = [];
  let isRecording = false;
  let analyserRAF = null;
  const MAX_RECORD_MS = 4500;
  let maxTimer = null;

  function getCtx(){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function showError(msg){
    errorBox.textContent = msg;
    errorBox.classList.remove('hidden');
  }
  function clearError(){
    errorBox.classList.add('hidden');
    errorBox.textContent = '';
  }

  btnMic.addEventListener('click', async ()=>{
    if(isRecording){
      stopRecording();
      return;
    }
    clearError();
    try{
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    }catch(err){
      showError('마이크 권한이 필요해요. 브라우저 설정에서 마이크 접근을 허용해주세요.');
      return;
    }
    startRecording();
  });

  function pickMimeType(){
    const candidates = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];
    for(const c of candidates){
      if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)) return c;
    }
    return '';
  }

  function startRecording(){
    recordedChunks = [];
    const mimeType = pickMimeType();
    try{
      mediaRecorder = mimeType ? new MediaRecorder(mediaStream, { mimeType }) : new MediaRecorder(mediaStream);
    }catch(err){
      showError('이 브라우저에서는 녹음이 지원되지 않아요.');
      cleanupStream();
      return;
    }
    mediaRecorder.ondataavailable = (e)=>{ if(e.data && e.data.size>0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = onRecordingStopped;
    mediaRecorder.start();

    isRecording = true;
    btnMic.classList.add('recording');
    btnMic.textContent = '■';
    micLabel.textContent = '녹음 중... (눌러서 종료)';
    statusLine.textContent = '';

    startLevelMeter();
    maxTimer = setTimeout(()=> stopRecording(), MAX_RECORD_MS);
  }

  function stopRecording(){
    if(!isRecording) return;
    isRecording = false;
    clearTimeout(maxTimer);
    btnMic.classList.remove('recording');
    btnMic.textContent = '🎙';
    micLabel.textContent = '분석 중...';
    stopLevelMeter();
    if(mediaRecorder && mediaRecorder.state !== 'inactive'){
      mediaRecorder.stop();
    }
  }

  function cleanupStream(){
    if(mediaStream){
      mediaStream.getTracks().forEach(t=>t.stop());
      mediaStream = null;
    }
  }

  function startLevelMeter(){
    const ctx = getCtx();
    const src = ctx.createMediaStreamSource(mediaStream);
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 256;
    src.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    function tick(){
      analyser.getByteFrequencyData(data);
      const step = Math.floor(data.length / LEVEL_BARS);
      for(let i=0;i<LEVEL_BARS;i++){
        let sum=0, n=0;
        for(let j=i*step;j<(i+1)*step && j<data.length;j++){ sum+=data[j]; n++; }
        const avg = n? sum/n : 0;
        const h = Math.max(3, Math.min(20, (avg/255)*20));
        levelBarEls[i].style.height = h+'px';
      }
      analyserRAF = requestAnimationFrame(tick);
    }
    tick();
    startLevelMeter._analyserNode = analyser;
    startLevelMeter._srcNode = src;
  }
  function stopLevelMeter(){
    if(analyserRAF){ cancelAnimationFrame(analyserRAF); analyserRAF = null; }
    levelBarEls.forEach(b=> b.style.height = '3px');
    try{
      if(startLevelMeter._srcNode) startLevelMeter._srcNode.disconnect();
    }catch(e){}
  }

  async function onRecordingStopped(){
    cleanupStream();
    if(recordedChunks.length === 0){
      showError('녹음된 소리가 없어요. 다시 시도해주세요.');
      resetRecordScreen();
      return;
    }
    const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
    try{
      const result = await computeSimilarity(blob);
      showResult(result.score, result.silent);
    }catch(err){
      console.error(err);
      showError('분석 중 문제가 발생했어요. 다시 시도해주세요.');
      resetRecordScreen();
    }
  }

  function resetRecordScreen(){
    micLabel.textContent = '눌러서 말하기!';
    statusLine.textContent = '';
    clearError();
    btnMic.classList.remove('recording');
    btnMic.textContent = '🎙';
    isRecording = false;
    if(refAudioEl && !refAudioEl.paused) refAudioEl.pause();
  }

  // ---------- Audio analysis ----------
  function base64ToArrayBuffer(base64){
    const binary = atob(base64);
    const len = binary.length;
    const bytes = new Uint8Array(len);
    for(let i=0;i<len;i++) bytes[i] = binary.charCodeAt(i);
    return bytes.buffer;
  }

  function toMono(buffer){
    const ch = buffer.numberOfChannels;
    const len = buffer.length;
    if(ch === 1) return buffer.getChannelData(0).slice();
    const out = new Float32Array(len);
    for(let c=0;c<ch;c++){
      const data = buffer.getChannelData(c);
      for(let i=0;i<len;i++) out[i] += data[i]/ch;
    }
    return out;
  }

  function trimSilence(samples, thresholdRatio){
    let max = 0;
    for(let i=0;i<samples.length;i++){ const a = Math.abs(samples[i]); if(a>max) max=a; }
    if(max < 1e-6) return samples;
    const thresh = max * (thresholdRatio || 0.04);
    let start = 0, end = samples.length - 1;
    while(start < end && Math.abs(samples[start]) < thresh) start++;
    while(end > start && Math.abs(samples[end]) < thresh) end--;
    const pad = 400;
    start = Math.max(0, start - pad);
    end = Math.min(samples.length - 1, end + pad);
    return samples.slice(start, end + 1);
  }

  function nextPow2(n){ let p = 1; while(p < n) p <<= 1; return p; }

  function fft(re, im){
    const n = re.length;
    for(let i=1, j=0; i<n; i++){
      let bit = n >> 1;
      for(; j & bit; bit >>= 1) j ^= bit;
      j ^= bit;
      if(i < j){
        let t = re[i]; re[i]=re[j]; re[j]=t;
        t = im[i]; im[i]=im[j]; im[j]=t;
      }
    }
    for(let len=2; len<=n; len<<=1){
      const ang = -2*Math.PI/len;
      const wr = Math.cos(ang), wi = Math.sin(ang);
      for(let i=0;i<n;i+=len){
        let curR=1, curI=0;
        const half = len>>1;
        for(let k=0;k<half;k++){
          const uR = re[i+k], uI = im[i+k];
          const vR = re[i+k+half]*curR - im[i+k+half]*curI;
          const vI = re[i+k+half]*curI + im[i+k+half]*curR;
          re[i+k] = uR+vR; im[i+k] = uI+vI;
          re[i+k+half] = uR-vR; im[i+k+half] = uI-vI;
          const nR = curR*wr - curI*wi;
          const nI = curR*wi + curI*wr;
          curR = nR; curI = nI;
        }
      }
    }
  }

  function frameSpectralCentroid(frame, sampleRate){
    const n = Math.max(64, nextPow2(frame.length));
    const re = new Float64Array(n);
    const im = new Float64Array(n);
    const L = frame.length;
    for(let i=0;i<L;i++){
      const w = L>1 ? (0.5 - 0.5*Math.cos(2*Math.PI*i/(L-1))) : 1;
      re[i] = frame[i]*w;
    }
    fft(re, im);
    let num=0, den=0;
    const half = n/2;
    for(let k=1;k<half;k++){
      const mag = Math.hypot(re[k], im[k]);
      const freq = k*sampleRate/n;
      num += freq*mag;
      den += mag;
    }
    return den > 1e-8 ? num/den : 0;
  }

  function extractFeatures(samples, sampleRate, numFrames){
    const energy = [], centroid = [];
    const total = samples.length;
    for(let f=0; f<numFrames; f++){
      const start = Math.floor(f*total/numFrames);
      const end = Math.max(start+1, Math.floor((f+1)*total/numFrames));
      const seg = samples.subarray(start, end);
      let sumSq = 0;
      for(let i=0;i<seg.length;i++) sumSq += seg[i]*seg[i];
      energy.push(Math.sqrt(sumSq/seg.length));
      centroid.push(frameSpectralCentroid(seg, sampleRate));
    }
    const maxE = Math.max.apply(null, energy.concat([1e-8]));
    const normE = energy.map(e=> e/maxE);
    const nyquist = sampleRate/2;
    const normC = centroid.map(c=> Math.min(1, c/nyquist));
    return { energy: normE, centroid: normC, duration: total/sampleRate };
  }

  function rms(samples){
    let sum = 0;
    for(let i=0;i<samples.length;i++) sum += samples[i]*samples[i];
    return Math.sqrt(sum/(samples.length || 1));
  }

  // Pearson correlation, clipped to [0,1]. Unlike cosine similarity on
  // non-negative curves (which is biased high for almost any two "bumpy"
  // positive signals), this centers each curve on its own mean first, so
  // unrelated or flat/silent input naturally lands near 0, not ~0.6-0.8.
  function pearsonSim(a,b){
    const n = a.length;
    let ma=0, mb=0;
    for(let i=0;i<n;i++){ ma+=a[i]; mb+=b[i]; }
    ma/=n; mb/=n;
    let num=0, da=0, db=0;
    for(let i=0;i<n;i++){
      const xa=a[i]-ma, xb=b[i]-mb;
      num += xa*xb; da += xa*xa; db += xb*xb;
    }
    if(da < 1e-10 || db < 1e-10) return 0;
    const corr = num/Math.sqrt(da*db);
    return Math.max(0, corr);
  }

    const [refDecoded, userDecoded] = await Promise.all([
      ctx.decodeAudioData(refBuf.slice(0)),
      userBlob.arrayBuffer().then(buf => ctx.decodeAudioData(buf))
    ]);

    const refRawMono = toMono(refDecoded);
    const userRawMono = toMono(userDecoded);

    // Absolute loudness check FIRST, on the untrimmed audio. This is the
    // piece that was missing before: with no gate, a silent/near-silent
    // recording still got shape-compared after being normalized by its own
    // (tiny) max, which made it look like a "full" curve and scored ~70%.
    const refRawRMS = rms(refRawMono);
    const userRawRMS = rms(userRawMono);
    const loudnessRatio = userRawRMS / Math.max(refRawRMS, 1e-6);

    if(loudnessRatio < LOUDNESS_GATE){
      return { score: Math.floor(Math.random()*5) + 1, silent: true };
    }

    const refMono = trimSilence(refRawMono, 0.04);
    const userMono = trimSilence(userRawMono, 0.04);

    if(userMono.length < 512){
      return { score: Math.floor(Math.random()*5) + 1, silent: true };
    }

    const refFeat = extractFeatures(refMono, refDecoded.sampleRate, NUM_FRAMES);
    const userFeat = extractFeatures(userMono, userDecoded.sampleRate, NUM_FRAMES);

    const energySim = pearsonSim(refFeat.energy, userFeat.energy);
    const centroidSim = pearsonSim(refFeat.centroid, userFeat.centroid);
    const longer = Math.max(refFeat.duration, userFeat.duration, 0.01);
    const durationSim = 1 - Math.min(1, Math.abs(refFeat.duration - userFeat.duration)/longer);
    const loudnessSim = Math.min(1, loudnessRatio);

    const raw = 0.35*energySim + 0.25*centroidSim + 0.15*durationSim + 0.25*loudnessSim;
    const score = Math.round(Math.max(1, Math.min(100, raw*100)));
    return { score, silent: false };
  }

  // ---------- Result screen ----------
  const gaugeArc = document.getElementById('gauge-arc');
  const gaugeNeedle = document.getElementById('gauge-needle');
  const scoreValue = document.getElementById('score-value');
  const rankTitle = document.getElementById('rank-title');
  const rankQuote = document.getElementById('rank-quote');
  const ARC_LEN = 333;


  function rankFor(score){
    if(score < 20) return { title:'부르릉 수련자', quote:'아직은 시동을 거는 단계예요. 다시 도전!' };
    if(score < 40) return { title:'부르릉 입문자', quote:'감은 잡았어요. 조금만 더 크게 질러보세요.' };
    if(score < 60) return { title:'에오-한 자', quote:'리듬이 슬슬 붙기 시작했어요.' };
    if(score < 80) return { title:'부르릉 유단자', quote:'꽤 그럴싸한데요? 이 정도면 인정!' };
    if(score < 95) return { title:'부르릉 에오', quote:'거의 원본급! 억양이 살아있어요.' };
    return { title:'에오! 에오! 에오!', quote:"와우~ 정말 놀라운걸요?" };
  }

  function showResult(score, silent){
    resetRecordScreen();
    showScreen('result');
    scoreValue.textContent = '0%';
    gaugeArc.style.strokeDashoffset = ARC_LEN;
    gaugeNeedle.style.transform = 'rotate(-90deg)';

    requestAnimationFrame(()=>{
      const angle = -90 + (score/100)*180;
      gaugeNeedle.style.transform = 'rotate(' + angle + 'deg)';
      gaugeArc.style.strokeDashoffset = String(ARC_LEN - (ARC_LEN*score/100));

      let cur = 0;
      const dur = 700;
      const t0 = performance.now();
      function step(t){
        const p = Math.min(1, (t-t0)/dur);
        cur = Math.round(score*p);
        scoreValue.textContent = cur + '%';
        if(p < 1) requestAnimationFrame(step);
        else scoreValue.textContent = score + '%';
      }
      requestAnimationFrame(step);
    });

    const r = silent
      ? { title:'무음 감지', quote:'목소리가 거의 감지되지 않았어요. 마이크에 가까이 대고 크게 외쳐보세요!' }
      : rankFor(score);
    rankTitle.textContent = r.title;
    rankQuote.textContent = r.quote;
  }

})();
